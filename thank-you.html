<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | AKS Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05070a; font-family: 'Inter', sans-serif; }
        .loader { border-top-color: #C5A059; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white flex items-center justify-center h-screen">
    <div class="text-center p-12 bg-white/5 border border-white/10 rounded-3xl max-w-lg">
        <div id="processing">
            <div class="loader w-16 h-16 border-4 border-white/10 rounded-full mx-auto mb-6"></div>
            <h1 class="text-2xl font-bold mb-2">Payment Secured</h1>
            <p class="text-gray-400">Our engines are generating your personalized AKS Intelligence Report. Please do not close this window.</p>
        </div>

        <div id="ready" class="hidden">
            <div class="text-[#C5A059] text-6xl mb-6">✓</div>
            <h1 class="text-3xl font-bold mb-4 font-heading">Report Ready</h1>
            <p class="text-gray-400 mb-8">Your bespoke roadmap has been generated and sent to your email.</p>
            <a href="#" class="inline-block px-10 py-4 bg-[#C5A059] text-black font-bold rounded-sm hover:brightness-110 transition">
                DOWNLOAD PDF NOW
            </a>
            <p class="mt-6 text-xs text-gray-600 uppercase tracking-widest">Receipt ID: #AKS-7699854</p>
        </div>
    </div>

    <script>
        // Simulate PDF generation time (5 seconds)
        setTimeout(() => {
            document.getElementById('processing').classList.add('hidden');
            document.getElementById('ready').classList.remove('hidden');
        }, 5000);
    </script>
</body>
</html>
