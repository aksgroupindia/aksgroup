<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | AKS Group Confirmation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">

    <nav class="flex justify-center items-center px-8 py-8 md:px-20 fixed w-full top-0 z-[100] backdrop-blur-xl border-b border-white/5">
        <div class="flex items-center gap-4">
            <svg width="40" height="40" viewBox="0 0 100 100" fill="none">
                <path d="M50 5L95 90H75L50 50L30 90H5L50 5Z" fill="#C5A059"/>
                <path d="M42 65H58V70H42V65Z" fill="#05070a"/>
            </svg>
            <span class="text-xl font-heading tracking-[0.3em] uppercase">AKS <span class="text-[#C5A059]">GROUP</span></span>
        </div>
    </nav>

    <section class="h-screen flex flex-col justify-center items-center text-center px-6 relative overflow-hidden">
        <div class="absolute w-[500px] h-[500px] bg-[#C5A059]/10 blur-[120px] rounded-full z-0"></div>

        <div class="relative z-10 space-y-8">
            <div class="inline-block p-4 rounded-full border border-[#C5A059]/20 mb-4">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C5A059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            
            <h1 class="text-5xl md:text-7xl font-heading font-bold uppercase tracking-tighter">
                Settlement <br> <span class="gold-gradient">Verified.</span>
            </h1>
            
            <div class="w-24 h-[1px] bg-[#C5A059]/50 mx-auto"></div>
            
            <p class="max-w-md mx-auto text-gray-500 text-sm md:text-base leading-relaxed font-light">
                Welcome to the inner circle, **Abakash Kumar Sah**'s intelligence engine has received your data. Your agentic report is currently being architected.
            </p>

            <div class="pt-10 flex flex-col items-center gap-6">
                <p class="text-[10px] tracking-[0.4em] text-gray-600 uppercase font-bold">Expect Dispatch via Email/WhatsApp</p>
                <a href="index.html" class="btn-gold">Return to Headquarters</a>
            </div>
        </div>
    </section>

    <footer class="fixed bottom-10 w-full text-center">
        <div class="flex justify-center items-center gap-3">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <p class="text-[9px] tracking-[0.3em] text-gray-600 uppercase">System Status: Report Generation In Progress</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
