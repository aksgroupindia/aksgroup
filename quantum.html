<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTUM EDGE | AI INFRASTRUCTURE & AUTOMATION</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#05070a] text-white font-sans selection:bg-[#C5A059] selection:text-black">

    <nav class="p-8 flex justify-between items-center border-b border-white/5">
        <a href="index.html" class="text-[10px] tracking-[0.6em] font-bold gold-gradient uppercase">AKS GROUP</a>
        <div class="h-[1px] w-12 bg-[#C5A059]/30"></div>
    </nav>

    <main class="py-24 px-6 max-w-4xl mx-auto">
        <header class="text-center mb-20">
            <p class="text-[#C5A059] text-[10px] tracking-[0.5em] font-bold mb-4 uppercase">Division: Technology</p>
            <h1 class="text-5xl md:text-7xl font-heading font-bold tracking-tighter mb-6 uppercase">Quantum Edge</h1>
            <p class="text-gray-500 text-xs tracking-widest leading-loose uppercase max-w-lg mx-auto">
                Deploying serverless logic, 256-bit encryption layers, and agentic autonomous business engines.
            </p>
        </header>

        <section class="glass-terminal p-10 rounded-3xl border border-white/10 relative overflow-hidden bg-black/40 shadow-2xl">
            <div id="intake-form">
                <h3 class="text-center text-[10px] tracking-[0.4em] text-gray-400 uppercase mb-10 font-mono">System Intake Protocol</h3>
                
                <form onsubmit="handleInitialCapture(event, 'quantum')" class="space-y-6">
                    <input type="text" name="entity" placeholder="DEVELOPMENT ENTITY / LEAD ARCHITECT" required 
                        class="w-full bg-white/5 border border-white/10 p-5 text-white font-mono text-xs focus:border-[#C5A059] outline-none transition">
                    
                    <input type="email" name="email" placeholder="SECURE DEV EMAIL" required 
                        class="w-full bg-white/5 border border-white/10 p-5 text-white font-mono text-xs focus:border-[#C5A059] outline-none transition">
                    
                    <textarea name="goals" placeholder="INFRASTRUCTURE GOALS / AUTOMATION REQUIREMENTS" required 
                        class="w-full bg-white/5 border border-white/10 p-5 text-white font-mono text-xs focus:border-[#C5A059] outline-none h-32 transition"></textarea>
                    
                    <button type="submit" class="w-full py-5 bg-[#C5A059] text-black text-[10px] font-bold tracking-[0.3em] uppercase hover:bg-white hover:text-black transition shadow-lg">
                        INITIATE TECH SETTLEMENT (₹9,999)
                    </button>
                </form>
            </div>

            <div id="settlement-node" class="hidden text-center space-y-8 animate-fade-in">
                <div class="h-[1px] w-full bg-white/10 my-8"></div>
                <p class="text-xs tracking-widest text-[#C5A059] uppercase font-mono">Verification Required for Core Access</p>
                
                <div class="bg-white p-3 rounded-xl inline-block shadow-[0_0_50px_rgba(197,160,89,0.1)]">
                    <img src="qr-code.jpeg" alt="AKS QUANTUM SETTLEMENT" class="w-48 h-48">
                </div>

                <div class="max-w-xs mx-auto">
                    <input type="text" id="utr_field" placeholder="12-DIGIT TRANSACTION UTR" 
                        class="w-full bg-black border border-[#C5A059]/40 p-4 text-[#C5A059] text-center font-mono tracking-widest text-sm outline-none">
                    <button onclick="verifyAndReveal('quantum')" class="w-full mt-4 py-4 border border-[#C5A059] text-[#C5A059] text-[10px] tracking-widest uppercase hover:bg-[#C5A059] hover:text-black transition font-bold">
                        Verify & Build Infrastructure
                    </button>
                </div>
            </div>

            <div id="solution-viewport" class="hidden mt-12 p-8 border border-white/10 bg-black/80 rounded-2xl animate-slide-up font-mono">
                </div>
        </section>
    </main>

    <footer class="py-12 text-center border-t border-white/5">
        <p class="text-[9px] text-gray-600 tracking-[0.5em] uppercase font-mono">© 2026 AKS GROUP | Quantum Edge Tech Node</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
