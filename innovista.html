<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNOVISTA | GLOBAL SCALING ADVISORY</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#05070a] text-white font-sans selection:bg-[#C5A059] selection:text-black">

    <nav class="p-8 flex justify-between items-center border-b border-white/5">
        <a href="index.html" class="text-[10px] tracking-[0.6em] font-bold gold-gradient uppercase">AKS GROUP</a>
        <div class="h-[1px] w-12 bg-[#C5A059]/30"></div>
    </nav>

    <main class="py-24 px-6 max-w-4xl mx-auto">
        <header class="text-center mb-20">
            <p class="text-[#C5A059] text-[10px] tracking-[0.5em] font-bold mb-4 uppercase">Division: Advisory</p>
            <h1 class="text-5xl md:text-7xl font-heading font-bold tracking-tighter mb-6 uppercase">Innovista</h1>
            <p class="text-gray-500 text-xs tracking-widest leading-loose uppercase max-w-lg mx-auto">
                Architecting market dominance through agentic autonomy and high-velocity digital scaling.
            </p>
        </header>

        <section class="glass-terminal p-12 rounded-3xl border border-[#C5A059]/20 relative overflow-hidden bg-gradient-to-b from-white/5 to-transparent shadow-[0_0_80px_rgba(197,160,89,0.05)]">
            <div id="intake-form">
                <h3 class="text-center text-[10px] tracking-[0.4em] text-[#C5A059] uppercase mb-10 font-bold">Executive Briefing Intake</h3>
                
                <form onsubmit="handleInitialCapture(event, 'innovista')" class="space-y-6">
                    <input type="text" name="entity" placeholder="CORPORATE ENTITY / PRINCIPAL NAME" required 
                        class="w-full bg-white/5 border border-white/10 p-5 text-white font-mono text-xs focus:border-[#C5A059] outline-none transition">
                    
                    <input type="email" name="email" placeholder="OFFICIAL CORRESPONDENCE EMAIL" required 
                        class="w-full bg-white/5 border border-white/10 p-5 text-white font-mono text-xs focus:border-[#C5A059] outline-none transition">
                    
                    <textarea name="goals" placeholder="SPECIFIC SCALING CHALLENGES / REVENUE TARGETS" required 
                        class="w-full bg-white/5 border border-white/10 p-5 text-white font-mono text-xs focus:border-[#C5A059] outline-none h-40 transition"></textarea>
                    
                    <div class="py-4 px-6 bg-[#C5A059]/10 border border-[#C5A059]/20 rounded-lg mb-4">
                        <p class="text-[9px] text-[#C5A059] uppercase tracking-widest text-center">Premium Advisory Fee: ₹15,000</p>
                    </div>

                    <button type="submit" class="w-full py-6 bg-[#C5A059] text-black text-[11px] font-bold tracking-[0.4em] uppercase hover:bg-white hover:text-black transition-all shadow-2xl">
                        INITIATE ADVISORY SETTLEMENT
                    </button>
                </form>
            </div>

            <div id="settlement-node" class="hidden text-center space-y-10 animate-fade-in">
                <div class="h-[1px] w-full bg-white/10 my-8"></div>
                <p class="text-xs tracking-widest text-[#C5A059] uppercase font-bold">Secure Settlement Required</p>
                
                <div class="bg-white p-4 rounded-2xl inline-block shadow-[0_0_60px_rgba(197,160,89,0.15)]">
                    <img src="qr-code.jpeg" alt="AKS INNOVISTA SETTLEMENT" class="w-56 h-56">
                </div>

                <div class="max-w-xs mx-auto">
                    <p class="text-[9px] text-gray-500 mb-4 uppercase font-mono">VPA: 7699854611-1@okbizaxis</p>
                    <input type="text" id="utr_field" placeholder="ENTER 12-DIGIT UTR" 
                        class="w-full bg-black border border-[#C5A059]/40 p-4 text-[#C5A059] text-center font-mono tracking-widest text-sm outline-none focus:border-[#C5A059] transition">
                    <button onclick="verifyAndReveal('innovista')" class="w-full mt-6 py-5 border border-[#C5A059] text-[#C5A059] text-[10px] tracking-widest uppercase hover:bg-[#C5A059] hover:text-black transition font-bold">
                        Verify & Execute Scaling Blueprint
                    </button>
                </div>
            </div>

            <div id="solution-viewport" class="hidden mt-12 p-10 border-l-2 border-[#C5A059] bg-white/5 rounded-r-2xl animate-slide-up">
                </div>
        </section>
    </main>

    <footer class="py-12 text-center border-t border-white/5">
        <p class="text-[9px] text-gray-600 tracking-[0.5em] uppercase">© 2026 AKS GROUP | Innovista Global Advisory</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
